name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 (not ubuntu-latest, currently 24.04/glibc 2.39):
          # the built binary dynamically links whatever glibc symbol
          # versions are present on the build host, so building on a newer
          # Ubuntu than the target machine fails at launch with "GLIBC_2.38
          # not found" (or similar) — building on an older LTS keeps the
          # binary's minimum glibc requirement low enough to run on most
          # currently-used distros (22.04 ships glibc 2.35).
          - os: ubuntu-22.04
            binary_name: caracal
            asset_name: caracal-linux-x86_64
          - os: windows-latest
            binary_name: caracal.exe
            asset_name: caracal-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cargo-packager reads the package version straight from Cargo.toml's
      # [package].version — it has no idea what git tag triggered the build.
      # Left un-synced, every tagged release would ship installers stamped
      # with whatever version happened to be committed (e.g. "0.1.0" forever)
      # instead of the tag (e.g. "0.6.0"). Cargo.lock carries its own copy of
      # the root package's version too, and `--locked` (used below) requires
      # it to match Cargo.toml exactly, so both files are patched together.
      - name: Sync Cargo.toml/Cargo.lock version to the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "/^name = \"caracal\"\$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.toml
          sed -i "/^name = \"caracal\"\$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock
          echo "Synced version to $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Swatinem/rust-cache's default key doesn't include the specific
          # OS version — ubuntu-22.04 and ubuntu-24.04 (ubuntu-latest) both
          # report runner.os == "Linux", so switching the matrix from
          # ubuntu-latest to ubuntu-22.04 silently reused a target/ dir
          # built under 24.04's toolchain/system libs. Cargo's fingerprints
          # matched (nothing looked stale) so it skipped rebuilding
          # dependencies entirely, but gpui_platform's cached build
          # artifacts were incompatible with the new environment, hence
          # "can't find crate for gpui_platform" despite no dependency
          # ever showing up in the "Compiling ..." log. Keying by matrix.os
          # isolates each OS's cache so this can't happen again.
          key: ${{ matrix.os }}

      # gpui_platform's x11/wayland/font-kit features and the serialport
      # crate's device-enumeration support need these dev headers/libs at
      # build time. Derived from Zed's own `script/linux` (gpui/gpui_platform
      # come from the Zed repo) and trimmed to what this project's actual
      # feature set uses — Zed's own list also carries audio/webrtc/sqlite/
      # git2 packages this project doesn't depend on. libdbus-1-dev is not
      # from that list — it's needed by libdbus-sys, pulled in via the
      # `keyring` crate's `sync-secret-service` feature (D-Bus Secret
      # Service backend, used for the optional OS-keyring convenience
      # unlock); without it, pkg-config can't find dbus-1.pc and the build
      # fails at libdbus-sys's build script.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan1 \
            libssl-dev \
            libudev-dev \
            libdbus-1-dev

      # No extra system packages on Windows: serialport uses the native
      # Win32 API (no libudev equivalent needed), and wgpu's DX12/Vulkan
      # backends build against what windows-latest already ships.

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Install cargo-packager
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: cargo install cargo-packager --version "^0.11" --locked

      - name: Package Windows installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        continue-on-error: true
        run: cargo packager --release --formats nsis

      - name: Package Linux .deb
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        continue-on-error: true
        run: cargo packager --release --formats deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      # Separate, distinctly-named artifact so the release job can attach
      # only the installer to the GitHub Release (not the raw binary above)
      # — see the release job's "pattern: installer-*" filter. Named
      # patterns differ per OS since that's what cargo-packager itself
      # produces (NSIS installers end in "-setup.exe", not the raw binary's
      # own asset_name). if-no-files-found is "ignore" rather than "error"
      # because packaging is allowed to fail without failing the build (see
      # continue-on-error above) — a failed pack means no installer file
      # exists yet, which isn't itself an error at upload time.
      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*.deb
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          generate_release_notes: true
