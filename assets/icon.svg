<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1b2436"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5a742" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5a742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="210" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6b483"/>
      <stop offset="1" stop-color="#c1875a"/>
    </radialGradient>
  </defs>

  <!-- App-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="220" fill="url(#glow)"/>

  <!-- Ear tufts (the caracal's signature) -->
  <polygon points="118,72 140,72 108,14" fill="#181818"/>
  <polygon points="394,72 372,72 404,14" fill="#181818"/>

  <!-- Ears -->
  <polygon points="176,206 238,182 128,64" fill="url(#fur)"/>
  <polygon points="336,206 274,182 384,64" fill="url(#fur)"/>
  <polygon points="182,192 222,180 162,120" fill="#f2ddc0"/>
  <polygon points="330,192 290,180 350,120" fill="#f2ddc0"/>

  <!-- Head -->
  <circle cx="256" cy="300" r="132" fill="url(#fur)"/>

  <!-- Tear stripes -->
  <path d="M 206,312 C 200,340 196,368 202,392" stroke="#3a2418" stroke-width="6"
        fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 306,312 C 312,340 316,368 310,392" stroke="#3a2418" stroke-width="6"
        fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#f5ede1" stroke-width="3" opacity="0.7" stroke-linecap="round">
    <line x1="170" y1="340" x2="110" y2="332"/>
    <line x1="170" y1="352" x2="106" y2="352"/>
    <line x1="170" y1="364" x2="110" y2="372"/>
    <line x1="342" y1="340" x2="402" y2="332"/>
    <line x1="342" y1="352" x2="406" y2="352"/>
    <line x1="342" y1="364" x2="402" y2="372"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="214" cy="298" rx="16" ry="20" fill="#123524"/>
  <ellipse cx="298" cy="298" rx="16" ry="20" fill="#123524"/>
  <ellipse cx="214" cy="300" rx="6" ry="10" fill="#0a0a0a"/>
  <ellipse cx="298" cy="300" rx="6" ry="10" fill="#0a0a0a"/>

  <!-- Nose + mouth -->
  <polygon points="246,332 266,332 256,348" fill="#2b1810"/>
  <path d="M 220,362 Q 238,378 256,362 Q 274,378 292,362" stroke="#2b1810"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
