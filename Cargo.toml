[package]
name = "caracal"
version = "0.1.0"
edition = "2024"
description = "Native GPUI GPU-accelerated terminal / SSH / serial client"
license = "MIT OR Apache-2.0"

[dependencies]

gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }

gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "1505b1487131adbb443f6c69e87847db35bfa2d1" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "1505b1487131adbb443f6c69e87847db35bfa2d1" }

# Terminal model + transport
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
# Serial-port I/O for the serial terminal backend. Default features include
# `libudev` on Linux for `available_ports()` port detection — requires
# libudev headers at build time (already present on this dev machine; on a
# fresh Linux box install `libudev-dev` / `systemd-devel`).
serialport = "4.9"

russh = "0.61"

russh-sftp = "2.3"

flume = "0.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "fs"] }

# Saved-connections/settings/quick-commands persistence (~/.caracal/*.toml,
# same folder on Windows and Linux — see `paths.rs`). Pure Rust, no
# gpui_component (CLAUDE.md §1 boundary).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Cross-platform home-directory resolution (`paths::app_dir`) — already a
# transitive dependency via other crates, promoted to direct since we call
# it ourselves now instead of a `$HOME`-env-var-only fallback that silently
# resolved to the current directory on Windows (no `$HOME` there).
dirs = "6"
# Encrypted connection-vault crypto (see docs/superpowers/specs/2026-07-15-encrypted-credential-storage-design.md).
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
# OS keyring for the opt-in "remember on this device" convenience unlock
# (see the design spec's "Convenience unlock" decision). Feature flags match
# nyaterm's (reference implementation): native Keychain/Credential Manager
# on macOS/Windows, D-Bus Secret Service (sync client) on Linux.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# UI localization (Settings -> General). Already a transitive dependency
# via gpui-component (which uses its own, independent i18n!() call for its
# own built-in strings) — this is our own, separate instance.
rust-i18n = "4"

# Misc
anyhow = "1"
# Opening a downloaded/uploaded file (or its containing folder) with the OS
# default handler, from the SFTP panel's transfer-list context menu. Already
# a transitive dependency via gpui_linux, promoted to direct since we call
# it ourselves now.
open = "5"
log = "0.4"
# `log::error!`/`warn!` calls throughout the app were silently swallowed with no
# logger backend installed — this wires them to stderr (`RUST_LOG=debug cargo
# run` for verbose output).
env_logger = "0.11"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
