[package]
name = "caracal"
version = "0.1.0"
edition = "2024"
description = "Native GPUI GPU-accelerated terminal / SSH / serial client"

[dependencies]
# --- Phase 1: bare window + local shell, cross-platform (Windows / Linux / macOS) ---
#
# Pull `gpui` and `gpui_platform` from the same Zed git revision so the platform
# facade (`gpui_platform`) and the core UI framework (`gpui`) always agree on
# their internal contract. The rev pin mirrors `longbridge/gpui-component` (which
# we use in Phase 5+) and is the most-baked known-good combo.
#
# Why git and not crates.io `gpui = "0.2.2"`: `gpui_platform` is a workspace
# internal crate of `zed-industries/zed` and is not published. It is the facade
# that re-exports `gpui_linux` / `gpui_macos` / `gpui_windows` and propagates
# the `wayland` / `x11` / `font-kit` / `runtime_shaders` features to them.
#
# Features enabled:
#   - `font-kit`     — needed on macOS for the bundled font system; on Linux it
#                      uses fontconfig (via `zed-font-kit`'s `dlopen` source).
#   - `x11`, `wayland` — Linux needs both: the runtime picks the active one
#                      through `WAYLAND_DISPLAY` / `DISPLAY`.
#   - `runtime_shaders` — macOS Metal runtime shader compilation (harmless on
#                      Linux/Windows; required on macOS for some effects).
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }

# Phase 5: dock shell (DockArea + panels). Pinned to a gpui-component rev that
# uses the SAME gpui git rev as above — they must agree or cargo can't unify
# gpui. Only `panels/` and `workspace.rs` may import it (CLAUDE.md §1); the
# `terminal/` world stays free of it.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "1505b1487131adbb443f6c69e87847db35bfa2d1" }

# Terminal model + transport
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
# SSH backend (Phase 4): russh client driven on a dedicated tokio runtime thread
# (see terminal/ssh.rs). Default crypto backend is aws-lc-rs (needs cmake/clang,
# which the build env has).
russh = "0.61"
# SFTP subsystem over the *same* russh connection (Phase 7). Stream-based, so
# decoupled from russh's exact version (we hand it channel.into_stream()).
russh-sftp = "2.3"

# Bridge plumbing (the only place cross-context channels live — see
# `terminal/bridge.rs` and CLAUDE.md §2). flume straddles blocking + async.
flume = "0.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "fs"] }

# Misc
anyhow = "1"
log = "0.4"
